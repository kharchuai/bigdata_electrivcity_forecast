# Dynamic catalog URI, credentials, warehouse and event-log location are supplied
# by storage.create_spark from local.yaml/.env. Keep secrets out of this file.
spark.master                         local[2]
spark.sql.timestampType              TIMESTAMP_NTZ
spark.sql.shuffle.partitions         8
spark.sql.adaptive.enabled           true
spark.driver.memory                  1g
spark.jars.packages                  org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.postgresql:postgresql:42.7.8
spark.jars.ivy                       /tmp/.ivy2
spark.ui.showConsoleProgress         false
spark.sql.extensions                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.redaction.regex                (?i)secret|password|token|access[.]?key
